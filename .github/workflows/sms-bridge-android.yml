name: SMS Bridge APK

on:
  push:
    branches: ["**"]
    paths:
      - "sms-bridge/**"
      - ".github/workflows/sms-bridge-android.yml"
  pull_request:
    paths:
      - "sms-bridge/**"
      - ".github/workflows/sms-bridge-android.yml"
  # Lets you rebuild the APK from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-bridge/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner image already ships the SDK. Left to its default this action tries to
          # install the legacy "tools" package, which Google has removed, and the step fails.
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-bridge-apk
          path: sms-bridge/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sms-bridge-test-report
          path: sms-bridge/android/app/build/reports/tests/
