<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הודעות סמסונג">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>הודעות מהסמסונג</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #151d2e;
    --card-2: #1b2438;
    --line: #26314a;
    --text: #eef2f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-press: #2563eb;
    --ok: #22c55e;
    --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  #status { font-size: 13px; color: var(--muted); }

  button {
    font: inherit; color: inherit; border: none; border-radius: 12px;
    background: var(--card-2); padding: 10px 14px; cursor: pointer;
  }
  button:active { opacity: .75; }

  #fetchBtn {
    width: 100%; background: var(--accent); color: #fff; font-size: 19px;
    font-weight: 700; padding: 18px; border-radius: 16px; margin-bottom: 12px;
  }
  #fetchBtn:active { background: var(--accent-press); }
  #fetchBtn[disabled] { opacity: .6; }

  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row > * { flex: 1; min-width: 0; }

  input[type="search"], input[type="text"] {
    width: 100%; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  input::placeholder { color: var(--muted); }

  .toggle { flex: 0 0 auto; border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
  .toggle[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

  #banner {
    display: none; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
    font-size: 14px; background: #3f1d1d; color: #fecaca; border: 1px solid #7f1d1d;
  }
  #banner.show { display: block; }
  #banner.info { background: #14283f; color: #bfdbfe; border-color: #1e3a5f; }

  .msg {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .msg.unread { border-color: var(--accent); }
  .msg-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .from { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 15px; }

  .codes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .code {
    font-family: ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 700;
    letter-spacing: 1px; background: var(--card-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 12px;
  }
  .code.copied { background: var(--ok); color: #07240f; border-color: var(--ok); }

  #empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .link { color: var(--accent); background: none; padding: 4px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>הודעות מהסמסונג</h1>
  <span id="status"></span>
</header>

<div id="banner"></div>

<button id="fetchBtn">הצג את ההודעות</button>

<div class="row">
  <input type="search" id="search" placeholder="חיפוש בהודעות…" autocomplete="off" enterkeyhint="search">
  <button class="toggle" id="unreadBtn" aria-pressed="false">לא נקראו</button>
</div>

<div id="list"></div>
<div id="empty">לחץ על הכפתור כדי למשוך את ההודעות מהסמסונג</div>

<footer>
  <span id="deviceInfo"></span>
  <br>
  <button class="link" id="resetBtn">החלף קוד גישה</button>
</footer>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "smsbridge.token";
  var els = {
    fetchBtn: document.getElementById("fetchBtn"),
    search: document.getElementById("search"),
    unreadBtn: document.getElementById("unreadBtn"),
    list: document.getElementById("list"),
    empty: document.getElementById("empty"),
    status: document.getElementById("status"),
    banner: document.getElementById("banner"),
    deviceInfo: document.getElementById("deviceInfo"),
    resetBtn: document.getElementById("resetBtn")
  };

  var messages = [];
  var unreadOnly = false;
  var loading = false;

  // ---------------------------------------------------------------- token

  function token() {
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return memoryToken; }
  }

  var memoryToken = "";
  function setToken(value) {
    memoryToken = value;
    try { localStorage.setItem(TOKEN_KEY, value); } catch (e) { /* private mode: keep in memory */ }
  }

  // The pairing URL carries the token; store it and scrub it from the address bar
  // so it does not linger in history or get shared by accident.
  (function captureTokenFromUrl() {
    var match = /[?&]t=([^&#]+)/.exec(location.search);
    if (match) {
      setToken(decodeURIComponent(match[1]));
      history.replaceState(null, "", location.pathname);
    }
  })();

  function promptForToken() {
    var entered = prompt("הקלד את קוד הגישה שמופיע באפליקציה בסמסונג:", "");
    if (entered) {
      setToken(entered.trim());
      load();
    }
  }

  // --------------------------------------------------------------- helpers

  function showBanner(text, kind) {
    els.banner.textContent = text;
    els.banner.className = "show" + (kind === "info" ? " info" : "");
  }

  function hideBanner() {
    els.banner.className = "";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatWhen(ms) {
    var date = new Date(ms);
    var diff = Date.now() - ms;
    if (diff < 60000) return "עכשיו";
    if (diff < 3600000) return "לפני " + Math.floor(diff / 60000) + " דק׳";

    var today = new Date();
    var sameDay = date.toDateString() === today.toDateString();
    var time = date.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
    if (sameDay) return time;

    var yesterday = new Date(today.getTime() - 86400000);
    if (date.toDateString() === yesterday.toDateString()) return "אתמול " + time;

    return date.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }) + " " + time;
  }

  // Verification codes are the main reason to look at another phone's SMS,
  // so pull them out and make them one tap to copy.
  function extractCodes(body) {
    var found = [];
    var re = /\b(\d{4,8})\b/g;
    var m;
    while ((m = re.exec(body)) !== null) {
      if (found.indexOf(m[1]) === -1) found.push(m[1]);
      if (found.length >= 3) break;
    }
    // Only offer the digits when the message reads like a verification message —
    // otherwise every price and account number turns into a "code" chip.
    return /קוד|code|otp|סיסמ|verification|אימות/i.test(body) ? found : [];
  }

  function copyText(text, node) {
    var done = function () {
      node.classList.add("copied");
      setTimeout(function () { node.classList.remove("copied"); }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }

  function legacyCopy(text, done) {
    var input = document.createElement("textarea");
    input.value = text;
    input.setAttribute("readonly", "");
    input.style.position = "absolute";
    input.style.left = "-9999px";
    document.body.appendChild(input);
    input.select();
    input.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); done(); } catch (e) { /* nothing else to try */ }
    document.body.removeChild(input);
  }

  // ------------------------------------------------------------------ view

  function render() {
    var query = els.search.value.trim().toLowerCase();
    var visible = messages.filter(function (m) {
      if (unreadOnly && m.read) return false;
      if (!query) return true;
      return (m.body || "").toLowerCase().indexOf(query) !== -1 ||
             (m.from || "").toLowerCase().indexOf(query) !== -1 ||
             (m.name || "").toLowerCase().indexOf(query) !== -1;
    });

    els.list.innerHTML = "";
    if (!visible.length) {
      els.empty.style.display = "block";
      els.empty.textContent = messages.length
        ? "אין הודעות שמתאימות לסינון"
        : "לחץ על הכפתור כדי למשוך את ההודעות מהסמסונג";
      return;
    }
    els.empty.style.display = "none";

    var fragment = document.createDocumentFragment();
    visible.forEach(function (m) {
      var card = document.createElement("div");
      card.className = "msg" + (m.read ? "" : " unread");

      var who = m.name || m.from || "לא ידוע";
      card.innerHTML =
        '<div class="msg-head">' +
          '<span class="from" dir="auto">' + escapeHtml(who) + "</span>" +
          '<span class="when">' + escapeHtml(formatWhen(m.date)) + "</span>" +
        "</div>" +
        '<div class="body" dir="auto">' + escapeHtml(m.body || "") + "</div>";

      var codes = extractCodes(m.body || "");
      if (codes.length) {
        var wrap = document.createElement("div");
        wrap.className = "codes";
        codes.forEach(function (code) {
          var btn = document.createElement("button");
          btn.className = "code";
          btn.textContent = code;
          btn.addEventListener("click", function () { copyText(code, btn); });
          wrap.appendChild(btn);
        });
        card.appendChild(wrap);
      }
      fragment.appendChild(card);
    });
    els.list.appendChild(fragment);
  }

  // ------------------------------------------------------------------ data

  function load() {
    if (loading) return;
    if (!token()) { promptForToken(); return; }

    loading = true;
    els.fetchBtn.disabled = true;
    els.fetchBtn.textContent = "מושך הודעות…";
    els.status.textContent = "";

    fetch("/api/messages?limit=300&token=" + encodeURIComponent(token()), { cache: "no-store" })
      .then(function (response) {
        return response.json().then(function (data) { return { status: response.status, data: data }; });
      })
      .then(function (result) {
        if (result.status === 401) {
          showBanner("קוד הגישה שגוי. לחץ על ״החלף קוד גישה״ למטה או סרוק שוב את הקוד באפליקציה.");
          return;
        }
        if (result.status === 429) {
          showBanner("יותר מדי ניסיונות שגויים. נסה שוב בעוד כמה דקות.");
          return;
        }
        if (!result.data || !result.data.ok) {
          showBanner((result.data && result.data.message) || "הבקשה נכשלה");
          return;
        }
        hideBanner();
        messages = result.data.messages || [];
        els.status.textContent = messages.length + " הודעות · " + formatWhen(Date.now());
        render();
        loadInfo();
      })
      .catch(function () {
        showBanner("אין חיבור לסמסונג. ודא שהגשר דולק באפליקציה ושהאייפון על אותה רשת Wi-Fi.");
      })
      .then(function () {
        loading = false;
        els.fetchBtn.disabled = false;
        els.fetchBtn.textContent = "רענן הודעות";
      });
  }

  function loadInfo() {
    fetch("/api/info?token=" + encodeURIComponent(token()), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (info) {
        if (info && info.ok) {
          els.deviceInfo.textContent = info.device + " · אנדרואיד " + info.android;
        }
      })
      .catch(function () { /* cosmetic only */ });
  }

  // --------------------------------------------------------------- wiring

  els.fetchBtn.addEventListener("click", load);
  els.search.addEventListener("input", render);
  els.resetBtn.addEventListener("click", promptForToken);
  els.unreadBtn.addEventListener("click", function () {
    unreadOnly = !unreadOnly;
    els.unreadBtn.setAttribute("aria-pressed", String(unreadOnly));
    render();
  });

  // Opening straight from the pairing QR should just work, with no extra tap.
  if (token()) load();
})();
</script>
</body>
</html>
